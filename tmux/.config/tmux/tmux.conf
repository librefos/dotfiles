set -g mouse on
set -g focus-events on
bind A split-window -h -l 40% -c "#{pane_current_path}" "claude"
bind C-q display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "bash -c 'read -rp \"ask> \" q; claude -p \"\$q\"; read -rn1'"
bind g display-popup -E -w 95% -h 95% \
  -d "#{pane_current_path}" "~/.local/bin/tmux-review"
